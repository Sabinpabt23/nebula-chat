services:
  postgres:
    image: postgres:15-alpine
    container_name: nebula_chat_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nebula_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nebula_dev_pass_2024}
      POSTGRES_DB: ${POSTGRES_DB:-nebula_chat_dev}
    ports:
      - "5433:5432"
    volumes:
      - nebula_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula_admin -d nebula_chat_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nebula_chat_network

  redis:
    image: redis:7-alpine
    container_name: nebula_chat_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-nebula_redis_pass_new} --port 6379
    ports:
      - "6380:6379"
    volumes:
      - nebula_redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-nebula_redis_pass_new}",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nebula_chat_network

  mailhog:
    image: mailhog/mailhog
    container_name: nebula_chat_mailhog
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - nebula_chat_network

networks:
  nebula_chat_network:
    driver: bridge

volumes:
  nebula_postgres_data:
  nebula_redis_data:
