<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Sign-In</title>
</head>
<body>
    <p>Signing in...</p>
    <script>
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const credential = params.get('id_token') || params.get('access_token');
        
        if (credential) {
            window.opener.postMessage({ type: 'google-login', credential }, window.location.origin);
            window.close();
        } else {
            window.opener.postMessage({ type: 'google-login', error: 'No credential received' }, window.location.origin);
            window.close();
        }
    </script>
</body>
</html>
